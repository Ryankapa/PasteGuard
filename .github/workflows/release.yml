name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test
        run: dotnet test -c Release

      - name: Build exe
        shell: pwsh
        run: ./build.ps1 -Version ("${{ github.ref_name }}".TrimStart("v"))

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/PasteGuard.exe
            publish/PasteGuard.exe.sha256
          generate_release_notes: true
